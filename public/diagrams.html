<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagrams - webodar3</title>
  <meta name="description" content="View stored PlantUML diagrams">
  <link rel="preload" href="/assets/fonts/PacaembuVar-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="/assets/fonts/MulishVar-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .diagram-item {
      border: 1px solid #2b4a85;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #20386b;
      color: #f5f7ff;
    }
    .diagram-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 15px;
    }
    .diagram-left-actions {
      display: flex;
      gap: 5px;
    }
    .diagram-left-actions button {
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid #2b4a85;
      background: #1a2f5a;
      border-radius: 4px;
      color: #f5f7ff;
      white-space: nowrap;
    }
    .diagram-left-actions button:hover {
      background: #2b4a85;
    }
    .diagram-label-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }
    .diagram-label-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .diagram-label {
      font-weight: bold;
      font-size: 1.2em;
      word-break: break-all;
      color: #f5f7ff;
      user-select: all;
      -webkit-user-select: all;
    }
    .copy-btn {
      padding: 4px 8px;
      cursor: pointer;
      border: 1px solid #2b4a85;
      background: #1a2f5a;
      border-radius: 4px;
      color: #f5f7ff;
      font-size: 0.85em;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .copy-btn:hover {
      background: #2b4a85;
    }
    .copy-btn.copied {
      background: #2d5a3d;
      border-color: #4caf50;
    }
    .copy-btn svg {
      width: 14px;
      height: 14px;
    }
    .diagram-actions {
      display: flex;
      gap: 10px;
    }
    .diagram-actions button {
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid #2b4a85;
      background: #1a2f5a;
      border-radius: 4px;
      color: #f5f7ff;
    }
    .diagram-actions button:hover {
      background: #2b4a85;
    }
    .diagram-actions button.danger {
      color: #ffb3b3;
      border-color: #8b3a3a;
      background: #4a1f2b;
    }
    .diagram-actions button.danger:hover {
      background: #5a2f3b;
    }
    .diagram-preview {
      margin-top: 10px;
      display: none;
    }
    .diagram-preview.expanded {
      display: block;
    }
    .diagram-preview-content {
      display: flex;
      gap: 15px;
      flex-direction: row;
    }
    .diagram-source {
      flex: 1 0;
      background: #152a52;
      border: 1px solid #2b4a85;
      border-radius: 4px;
      padding: 15px;
      width: fit-content;
    }
    .diagram-source h4 {
      margin: 0 0 10px 0;
      color: #8ab4ff;
      font-size: 0.95em;
    }
    .diagram-source pre {
      margin: 0;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      color: #f5f7ff;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
    }
    .diagram-iframe-container {
      flex: 1;
      min-width: 0;
    }
    .diagram-preview iframe {
      min-height: 400px;
      border: 1px solid #2b4a85;
      border-radius: 4px;
      background: white;
    }
    .diagram-meta {
      font-size: 0.9em;
      color: #b3c6f5;
    }
    .error-message {
      color: #ffb3b3;
      padding: 10px;
      background: #4a1f2b;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0366d6;
      text-decoration: none;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .diagram-preview-content {
        flex-direction: column;
      }
      .diagram-source {
        flex: 1;
      }
      .diagram-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .diagram-left-actions, .diagram-actions {
        flex-wrap: nowrap;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="https://www.netlify.com/">
        <img src="/assets/images/logo-netlify-small-monochrome-darkmode.svg" class="nf-logo" alt="Netlify">
      </a>
    </nav>
    <section>
      <h1>Stored PlantUML Diagrams</h1>
      <p>View and manage PlantUML diagrams stored in Netlify Blobs</p>
    </section>
  </header>
  <hr>
  <main>
    <section style="max-width: 95%">
      <div class="top-actions">
        <a href="/" class="nav-link">← Back to Home</a>
        <a href="/env.html" class="nav-link">View Environment Variables →</a>
      </div>
      <div id="error-container"></div>
      <div id="loading" class="loading">Loading diagrams...</div>
      <div id="diagrams-container"></div>
    </section>
  </main>
  <footer>
  </footer>

  <script>
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function copyLabel(label, button) {
      try {
        await navigator.clipboard.writeText(label);
        const originalText = button.innerHTML;
        button.classList.add('copied');
        button.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Copied!
        `;
        setTimeout(() => {
          button.classList.remove('copied');
          button.innerHTML = originalText;
        }, 2000);
      } catch (err) {
        console.error('Failed to copy:', err);
        alert('Failed to copy label to clipboard');
      }
    }

    async function loadDiagrams() {
      const loadingEl = document.getElementById('loading');
      const errorContainer = document.getElementById('error-container');
      const diagramsContainer = document.getElementById('diagrams-container');

      try {
        const response = await fetch('/.netlify/functions/diagrams');
        const data = await response.json();

        loadingEl.style.display = 'none';

        if (data.status === 'error') {
          errorContainer.innerHTML = `
            <div class="error-message">
              <strong>Error:</strong> ${data.message}
              ${data.details ? `<pre>${JSON.stringify(data.details, null, 2)}</pre>` : ''}
            </div>
          `;
          return;
        }

        if (data.diagrams.length === 0) {
          diagramsContainer.innerHTML = '<p>No diagrams stored yet.</p>';
          return;
        }

        diagramsContainer.innerHTML = data.diagrams.map(diagram => {
          const safeLabel = escapeHtml(diagram.label);
          const previewId = `preview-${encodeURIComponent(diagram.label)}`;

          return `
          <div class="diagram-item" data-label="${safeLabel}">
            <div class="diagram-header">
              <div class="diagram-left-actions">
                <button onclick="togglePreview('${safeLabel}')">Show/Hide</button>
              </div>
              <div class="diagram-label-group">
                <div class="diagram-label-container">
                  <div class="diagram-label">${safeLabel}</div>
                  <button class="copy-btn" onclick="copyLabel('${safeLabel}', this)" title="Copy label">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy
                  </button>
                </div>
                <div class="diagram-meta">
                  Created: ${new Date(diagram.createdAt).toLocaleString()}
                </div>
              </div>
              <div class="diagram-actions">
                ${diagram.url ? `<button onclick="window.open('${diagram.url}', '_blank')">Open URL</button>` : ''}
                <button class="danger" onclick="deleteDiagram('${safeLabel}')">Delete</button>
              </div>
            </div>
            ${diagram.url ? `
              <div class="diagram-preview" id="${previewId}">
                <div class="diagram-preview-content">
                  <div class="diagram-source">
                    <pre>${escapeHtml(diagram.plantumlCode || 'No source code available')}</pre>
                  </div>
                  <div class="diagram-iframe-container">
                    <iframe src="${diagram.url}" frameborder="0"></iframe>
                  </div>
                </div>
              </div>
            ` : '<p>No preview URL available</p>'}
          </div>
        `;
        }).join('');

      } catch (error) {
        loadingEl.style.display = 'none';
        errorContainer.innerHTML = `
          <div class="error-message">
            <strong>Error loading diagrams:</strong> ${error.message}
          </div>
        `;
      }
    }

    function togglePreview(label) {
      const preview = document.getElementById(`preview-${encodeURIComponent(label)}`);
      if (preview) {
        preview.classList.toggle('expanded');
      }
    }

    async function deleteDiagram(label) {
      if (!confirm(`Are you sure you want to delete diagram '${label}'?`)) {
        return;
      }

      try {
        const response = await fetch(`/.netlify/functions/diagrams?label=${encodeURIComponent(label)}`, {
          method: 'DELETE'
        });
        const data = await response.json();

        if (data.status === 'success') {
          const escapedLabel = window.CSS && CSS.escape
            ? CSS.escape(label)
            : label.replace(/["\\]/g, '\\$&');
          const item = document.querySelector(`[data-label="${escapedLabel}"]`);
          if (item) {
            item.remove();
          }

          if (document.querySelectorAll('.diagram-item').length === 0) {
            document.getElementById('diagrams-container').innerHTML = '<p>No diagrams stored yet.</p>';
          }
        } else {
          alert(`Error: ${data.message}`);
        }
      } catch (error) {
        alert(`Error deleting diagram: ${error.message}`);
      }
    }

    loadDiagrams();
  </script>
</body>
</html>
