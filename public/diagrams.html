<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagrams - webodar3</title>
  <meta name="description" content="View stored PlantUML diagrams">
  <link rel="preload" href="https://example-styles.netlify.app/fonts/PacaembuVar-latin.woff2" as="font" type="font/woff2" />
  <link rel="preload" href="https://example-styles.netlify.app/fonts/MulishVar-latin.woff2" as="font" type="font/woff2" />
  <link rel="stylesheet" href="https://example-styles.netlify.app/styles.css">
  <style>
    .diagram-item {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .diagram-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .diagram-label {
      font-weight: bold;
      font-size: 1.2em;
    }
    .diagram-actions {
      display: flex;
      gap: 10px;
    }
    .diagram-actions button {
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid #333;
      background: white;
      border-radius: 4px;
    }
    .diagram-actions button:hover {
      background: #f0f0f0;
    }
    .diagram-actions button.danger {
      color: #d73a49;
      border-color: #d73a49;
    }
    .diagram-actions button.danger:hover {
      background: #ffeef0;
    }
    .diagram-preview {
      margin-top: 10px;
      display: none;
    }
    .diagram-preview.expanded {
      display: block;
    }
    .diagram-preview iframe {
      width: 100%;
      min-height: 400px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .diagram-meta {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
    }
    .error-message {
      color: #d73a49;
      padding: 10px;
      background: #ffeef0;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0366d6;
      text-decoration: none;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="https://www.netlify.com/">
        <img src="https://example-styles.netlify.app/images/logo-netlify-small-monochrome-darkmode.svg" class="nf-logo" alt="Netlify">
      </a>
    </nav>
    <section>
      <h1>Stored PlantUML Diagrams</h1>
      <p>View and manage PlantUML diagrams stored in Netlify Blobs</p>
    </section>
  </header>
  <hr>
  <main>
    <section>
      <div class="top-actions">
        <a href="/" class="nav-link">← Back to Home</a>
        <a href="/env.html" class="nav-link">View Environment Variables →</a>
      </div>
      <div id="error-container"></div>
      <div id="loading" class="loading">Loading diagrams...</div>
      <div id="diagrams-container"></div>
    </section>
  </main>
  <footer>
    <div>
      <a href="https://www.netlify.com/"><img src="https://example-styles.netlify.app/images/logo-netlify-small-monochrome-lightmode.svg" class="nf-logo" alt="Netlify logo"></a>
    </div>
    <small>
      <div>© 2025 Netlify</div>
    </small>
  </footer>

  <script>
    async function loadDiagrams() {
      const loadingEl = document.getElementById('loading');
      const errorContainer = document.getElementById('error-container');
      const diagramsContainer = document.getElementById('diagrams-container');

      try {
        const response = await fetch('/.netlify/functions/diagrams');
        const data = await response.json();

        loadingEl.style.display = 'none';

        if (data.status === 'error') {
          errorContainer.innerHTML = `
            <div class="error-message">
              <strong>Error:</strong> ${data.message}
              ${data.details ? `<pre>${JSON.stringify(data.details, null, 2)}</pre>` : ''}
            </div>
          `;
          return;
        }

        if (data.diagrams.length === 0) {
          diagramsContainer.innerHTML = '<p>No diagrams stored yet.</p>';
          return;
        }

        diagramsContainer.innerHTML = data.diagrams.map(diagram => `
          <div class="diagram-item" data-label="${diagram.label}">
            <div class="diagram-header">
              <div class="diagram-label">${diagram.label}</div>
              <div class="diagram-actions">
                <button onclick="togglePreview('${diagram.label}')">Show/Hide</button>
                ${diagram.url ? `<button onclick="window.open('${diagram.url}', '_blank')">Open URL</button>` : ''}
                <button class="danger" onclick="deleteDiagram('${diagram.label}')">Delete</button>
              </div>
            </div>
            <div class="diagram-meta">
              Created: ${new Date(diagram.createdAt).toLocaleString()}
            </div>
            ${diagram.url ? `
              <div class="diagram-preview" id="preview-${diagram.label}">
                <iframe src="${diagram.url}" frameborder="0"></iframe>
              </div>
            ` : '<p>No preview URL available</p>'}
          </div>
        `).join('');

      } catch (error) {
        loadingEl.style.display = 'none';
        errorContainer.innerHTML = `
          <div class="error-message">
            <strong>Error loading diagrams:</strong> ${error.message}
          </div>
        `;
      }
    }

    function togglePreview(label) {
      const preview = document.getElementById(`preview-${label}`);
      if (preview) {
        preview.classList.toggle('expanded');
      }
    }

    async function deleteDiagram(label) {
      if (!confirm(`Are you sure you want to delete diagram '${label}'?`)) {
        return;
      }

      try {
        const response = await fetch(`/.netlify/functions/diagrams?label=${encodeURIComponent(label)}`, {
          method: 'DELETE'
        });
        const data = await response.json();

        if (data.status === 'success') {
          document.querySelector(`[data-label="${label}"]`).remove();
          
          if (document.querySelectorAll('.diagram-item').length === 0) {
            document.getElementById('diagrams-container').innerHTML = '<p>No diagrams stored yet.</p>';
          }
        } else {
          alert(`Error: ${data.message}`);
        }
      } catch (error) {
        alert(`Error deleting diagram: ${error.message}`);
      }
    }

    loadDiagrams();
  </script>
</body>
</html>
