<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Env Viewer - webodar3</title>
  <link rel="stylesheet" href="https://example-styles.netlify.app/styles.css">
  <style>
    pre {
      background: #f4f4f4;
      padding: 20px;
      overflow-x: auto;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a> | <a href="/diagrams.html">Diagrams</a>
    </nav>
    <section>
        <h1>Environment Variables</h1>
        <p>Values are masked, showing only the last 4 characters.</p>
    </section>
  </header>
  <main>
    <section>
        <pre id="env-data">Loading...</pre>
    </section>
  </main>
  <script>
    async function fetchEnv() {
      try {
        const response = await fetch('/api/env');
        const data = await response.json();
        document.getElementById('env-data').innerText = JSON.stringify(data, null, 2);
      } catch (error) {
        document.getElementById('env-data').innerText = 'Error loading env: ' + error.message;
      }
    }
    fetchEnv();
  </script>
</body>
</html>
